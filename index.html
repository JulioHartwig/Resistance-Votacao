<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resistance – Votação da Missão</title>
<style>
:root{--bg:#f4f5f7;--fg:#14171c;--mut:#667085;--card:#fff;--ok:#1f9d55;--bad:#d64545;--ac:#2f5bea;--bd:#d9dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--fg:#f1f3f6;--mut:#98a2b3;--card:#181c23;--bd:#2a303a}}
:root[data-theme="dark"]{--bg:#0e1116;--fg:#f1f3f6;--mut:#98a2b3;--card:#181c23;--bd:#2a303a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;gap:18px;text-align:center;max-width:480px;margin:0 auto}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.3rem;margin:0}
p{margin:0;color:var(--mut);line-height:1.4}
.big{font-size:4rem;font-weight:800}
.row{display:flex;gap:10px;align-items:center;justify-content:center;width:100%}
.stepper button{width:56px;height:56px;font-size:1.8rem;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.stepper .n{font-size:3rem;font-weight:800;min-width:80px}
.btn{width:100%;padding:18px;font-size:1.2rem;font-weight:700;border:0;border-radius:16px;background:var(--ac);color:#fff;cursor:pointer}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.btn:disabled{opacity:.35}
.vote{flex:1;min-height:150px;font-size:1.6rem;font-weight:800;color:#fff;border:4px solid transparent;border-radius:20px;cursor:pointer}
.vote.s{background:var(--ok)}.vote.f{background:var(--bad)}
.vote.sel{border-color:var(--fg);transform:scale(1.03)}
.votes{display:flex;gap:12px;width:100%}
label{display:flex;gap:10px;align-items:center;color:var(--mut);text-align:left}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bd)}.dot.on{background:var(--ac)}
.res{padding:24px;border-radius:20px;width:100%;color:#fff}
.res.s{background:var(--ok)}.res.f{background:var(--bad)}
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card{width:54px;height:76px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff}
.card.s{background:var(--ok)}.card.f{background:var(--bad)}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
var app=document.getElementById('app');
var st={step:'setup',total:3,fails2:false,i:0,votes:[],sel:null};
function h(html){app.innerHTML=html}
function $(id){return document.getElementById(id)}
function render(){
 if(st.step==='setup'){
  h('<h1>🗳️ Votação da Missão</h1><p>Quantas pessoas estão na missão?</p>'+
   '<div class="row stepper"><button id="m">−</button><div class="n">'+st.total+'</div><button id="p">+</button></div>'+
   '<label><input type="checkbox" id="f2"'+(st.fails2?' checked':'')+'> Precisa de 2 falhas para a missão falhar</label>'+
   '<button class="btn" id="go">Começar</button>');
  $('m').onclick=function(){if(st.total>2){st.total--;render()}};
  $('p').onclick=function(){if(st.total<10){st.total++;render()}};
  $('f2').onchange=function(e){st.fails2=e.target.checked};
  $('go').onclick=function(){st.i=0;st.votes=[];st.step='pass';render()};
 }
 else if(st.step==='pass'){
  var dots='';for(var k=0;k<st.total;k++)dots+='<div class="dot'+(k<st.i?' on':'')+'"></div>';
  h('<div class="dots">'+dots+'</div><p>Voto '+(st.i+1)+' de '+st.total+'</p><h2>Passe o celular para o próximo jogador</h2><p>Só toque quando estiver com o aparelho e ninguém estiver olhando.</p><button class="btn" id="show">Sou eu, mostrar opções</button>');
  $('show').onclick=function(){st.sel=null;st.step='vote';render()};
 }
 else if(st.step==='vote'){
  h('<h2>Seu voto é secreto</h2><div class="votes"><button class="vote s'+(st.sel==='s'?' sel':'')+'" id="vs">✔<br>Sucesso</button><button class="vote f'+(st.sel==='f'?' sel':'')+'" id="vf">✖<br>Falha</button></div>'+
   '<button class="btn" id="ok"'+(st.sel?'':' disabled')+'>Confirmar voto</button>');
  $('vs').onclick=function(){st.sel='s';render()};
  $('vf').onclick=function(){st.sel='f';render()};
  $('ok').onclick=function(){
   if(!st.sel)return;
   st.votes.push(st.sel);st.sel=null;st.i++;
   if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}
   st.step=st.i>=st.total?'ready':'pass';render();
  };
 }
 else if(st.step==='ready'){
  h('<h1>✅ Todos votaram</h1><p>Quando o grupo estiver pronto, revele o resultado.</p><button class="btn" id="rv">Revelar resultado</button>');
  $('rv').onclick=function(){st.step='result';render()};
 }
 else if(st.step==='result'){
  var fails=st.votes.filter(function(v){return v==='f'}).length;
  var need=st.fails2?2:1;
  var ok=fails<need;
  var shuffled=st.votes.slice().sort(function(){return Math.random()-.5});
  var cards=shuffled.map(function(v){return '<div class="card '+v+'">'+(v==='s'?'✔':'✖')+'</div>'}).join('');
  h('<div class="res '+(ok?'s':'f')+'"><div class="big">'+(ok?'SUCESSO':'FALHA')+'</div><p style="color:#fff">'+fails+(fails===1?' voto de falha':' votos de falha')+'</p></div>'+
   '<div class="cards">'+cards+'</div><p>As cartas foram embaralhadas para não revelar a ordem.</p>'+
   '<button class="btn" id="again">Nova votação</button><button class="btn alt" id="cfg">Mudar configurações</button>');
  $('again').onclick=function(){st.i=0;st.votes=[];st.step='pass';render()};
  $('cfg').onclick=function(){st.step='setup';render()};
 }
}
render();
})();
</script>
</body>
</html>
